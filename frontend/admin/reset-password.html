<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Agendamente</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Premium Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-gradient min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md animate-fade-in">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <div class="inline-flex p-3 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 mb-3">
        <i data-lucide="key-round" class="w-8 h-8 text-indigo-400"></i>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">
        <span class="gradient-text font-black">Agendamente</span>
      </h1>
      <p class="text-slate-400 mt-2 text-sm">Painel Administrativo do Profissional</p>
    </div>

    <!-- Recovery Card -->
    <div class="glass-card p-8 rounded-2xl space-y-6">
      <h2 id="card-title" class="text-xl font-bold text-white text-center">Recuperação de Senha</h2>
      <p id="card-subtitle" class="text-xs text-slate-400 text-center">Digite seu e-mail cadastrado para receber as instruções de recuperação.</p>

      <!-- Erros / Alertas -->
      <div id="alert-box" class="hidden p-3 rounded-lg text-sm flex items-start gap-2 border border-white/5">
        <i data-lucide="alert-circle" id="alert-icon" class="w-5 h-5 shrink-0"></i>
        <span id="alert-message"></span>
      </div>

      <!-- FORMULÁRIO A: SOLICITAR RECUPERAÇÃO -->
      <form id="form-forgot" class="space-y-4">
        <div>
          <label class="form-label" for="forgot-email">E-mail Cadastrado</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400"></i>
            </span>
            <input type="email" id="forgot-email" class="form-input pl-10" placeholder="seuemail@exemplo.com" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2">
          <span>Enviar Link de Recuperação</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- FORMULÁRIO B: REDEFINIR SENHA (HIDDEN POR PADRÃO) -->
      <form id="form-reset" class="space-y-4 hidden">
        <div>
          <label class="form-label" for="reset-senha">Nova Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
            </span>
            <input type="password" id="reset-senha" class="form-input pl-10" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
        </div>

        <div>
          <label class="form-label" for="reset-confirmar">Confirmar Nova Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
            </span>
            <input type="password" id="reset-confirmar" class="form-input pl-10" placeholder="Confirme a senha" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2">
          <span>Redefinir Senha</span>
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Rodapé do Card -->
      <div class="text-center pt-2">
        <a href="/admin-login" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold hover:underline flex items-center justify-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar para o Login
        </a>
      </div>
    </div>
  </div>

  <script>
    // Inicializa ícones lucide
    lucide.createIcons();

    // Elementos da UI
    const formForgot = document.getElementById('form-forgot');
    const formReset = document.getElementById('form-reset');
    const cardTitle = document.getElementById('card-title');
    const cardSubtitle = document.getElementById('card-subtitle');
    const alertBox = document.getElementById('alert-box');
    const alertMessage = document.getElementById('alert-message');

    // Analisa a URL em busca do token de redefinição
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // Chaveia o formulário correto dependendo da presença do token
    if (token) {
      formForgot.classList.add('hidden');
      formReset.classList.remove('hidden');
      cardTitle.innerText = 'Definir Nova Senha';
      cardSubtitle.innerText = 'Digite e confirme a sua nova senha de acesso.';
    }

    // Helpers de Alerta
    function showAlert(message, type = 'error') {
      alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/20', 'text-rose-500', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-600');
      alertMessage.innerText = message;
      
      if (type === 'error') {
        alertBox.classList.add('bg-rose-500/10', 'border-rose-500/20', 'text-rose-400');
        document.getElementById('alert-icon').className = 'w-5 h-5 shrink-0 text-rose-400';
      } else {
        alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
        document.getElementById('alert-icon').className = 'w-5 h-5 shrink-0 text-emerald-400';
      }
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }

    // Formulário A: Solicitação do Link
    formForgot.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('forgot-email').value;

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Falha ao processar solicitação.');
        }

        showAlert('E-mail enviado! Verifique sua caixa de entrada (ou o console do servidor se em desenvolvimento).', 'success');
        formForgot.reset();

      } catch (err) {
        showAlert(err.message);
      }
    });

    // Formulário B: Redefinição com o Token
    formReset.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const novaSenha = document.getElementById('reset-senha').value;
      const confirmarSenha = document.getElementById('reset-confirmar').value;

      if (novaSenha !== confirmarSenha) {
        showAlert('As senhas não coincidem. Por favor, digite senhas iguais.');
        return;
      }

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Falha ao redefinir a senha.');
        }

        showAlert('Senha alterada com sucesso! Redirecionando para login...', 'success');
        formReset.reset();

        setTimeout(() => {
          window.location.href = '/admin-login';
        }, 2000);

      } catch (err) {
        showAlert(err.message);
      }
    });
  </script>
</body>
</html>
